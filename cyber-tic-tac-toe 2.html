<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe: God Mode</title>
    <style>
        :root { --neon: #00fff0; --pink: #ff0055; --bg: #050508; --card: #0d0e1b; }
        .retro-theme { --neon: #ff00ff; --pink: #00ff00; --bg: #1a001a; --card: #330033; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; text-align: center; margin: 0; padding: 15px; transition: background 0.5s; }
        h1 { color: var(--neon); text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px var(--neon); margin: 5px 0; }
        
        /* Menu & Buttons Controls */
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { background: var(--card); color: #fff; border: 2px solid #1f2242; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn.active { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); color: var(--neon); }
        .btn:hover { border-color: var(--pink); }

        .scoreboard { display: flex; justify-content: center; gap: 25px; margin: 15px 0; font-size: 13px; text-transform: uppercase; }
        .scoreboard span { display: block; font-size: 28px; font-weight: bold; color: #ffaa00; }
        #status { font-size: 20px; margin-bottom: 15px; font-weight: bold; }
        
        /* Board Layout */
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; }
        .cell { width: 90px; height: 90px; background: var(--card); border: 2px solid #1f2242; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; cursor: pointer; transition: all 0.2s; }
        .cell:hover { border-color: var(--neon); transform: scale(1.05); }
        .cell.X { color: var(--pink); text-shadow: 0 0 15px var(--pink); }
        .cell.O { color: var(--neon); text-shadow: 0 0 15px var(--neon); }
        
        /* Action Button */
        #resetBtn { margin-top: 15px; padding: 10px 30px; background: linear-gradient(45deg, var(--pink), #b3003b); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 12px rgba(255,0,85,0.3); }
        
        /* Live Game Logger Terminal */
        .logger { max-width: 300px; margin: 20px auto 0 auto; background: #000; border: 1px solid #1f2242; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 11px; height: 60px; overflow-y: auto; text-align: left; color: #55ff55; box-shadow: inset 0 0 5px #003300; }
    </style>
</head>
<body>

    <h1>Ultimate Tic-Tac-Toe</h1>
    
    <!-- Upgrade 1: Dynamic Game Settings Panels -->
    <div class="controls">
        <button class="btn active" id="modeAI">ð¤ VS COMPUTER</button>
        <button class="btn" id="modePlayer">ð¥ 2-PLAYER</button>
        <button class="btn" id="themeToggle">ð¨ THEME</button>
        <button class="btn" id="mToggle">ðµ MUSIC: OFF</button>
    </div>

    <div class="scoreboard">
        <div>Player 1 (X)<span id="uScore">0</span></div>
        <div>Draws<span id="dScore">0</span></div>
        <div id="p2Label">AI-Bot (O)<span id="cScore">0</span></div>
    </div>
    
    <h3 id="status">Aapki baari (X)</h3>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="resetBtn">Next Round</button>

    <!-- Upgrade 3: Live Terminal Logger Console -->
    <div class="logger" id="logConsole">> Game Loaded. Ready to Play!</div>

    <script>
        // --- SOUNDS ---
        const clickSound = new Audio("https://actions.google.com/sounds/v1/digital_watch/digital_watch_alarm_long.ogg");
        const winSound = new Audio("https://actions.google.com/sounds/v1/science_fiction/ambient_space_machine.ogg");
        const bgMusic = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3");
        clickSound.volume = 0.3; bgMusic.loop = true; bgMusic.volume = 0.12;

        let isMusicOn = false;
        document.getElementById('mToggle').addEventListener('click', (e) => {
            isMusicOn = !isMusicOn;
            if (isMusicOn) { bgMusic.play(); e.target.innerText = "ð MUSIC: ON"; log("Music started."); }
            else { bgMusic.pause(); e.target.innerText = "ðµ MUSIC: OFF"; log("Music muted."); }
        });

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('retro-theme');
            log("Theme changed successfully.");
        });

        // --- GAME SYSTEM DATA ---
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const logConsole = document.getElementById('logConsole');
        
        let scores = { player1: 0, player2: 0, draw: 0 };
        let gameMode = "AI"; // AI ya Player
        let currentPlayer = "X"; 
        let isGameActive = true;
        let gameState = ["", "", "", "", "", "", "", "", ""];
        const winLines = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

        // Logger Function
        function log(msg) {
            logConsole.innerHTML += `<br>> ${msg}`;
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        // Mode Switching
        document.getElementById('modeAI').addEventListener('click', (e) => {
            if (gameMode === "AI") return; gameMode = "AI"; resetGame(); resetScores();
            document.getElementById('modeAI').classList.add('active');
            document.getElementById('modePlayer').classList.remove('active');
            document.getElementById('p2Label').innerHTML = `AI-Bot (O)<span id="cScore">0</span>`;
            log("Switched to VS Computer Mode.");
        });

        document.getElementById('modePlayer').addEventListener('click', (e) => {
            if (gameMode === "Player") return; gameMode = "Player"; resetGame(); resetScores();
            document.getElementById('modePlayer').classList.add('active');
            document.getElementById('modeAI').classList.remove('active');
            document.getElementById('p2Label').innerHTML = `Player 2 (O)<span id="cScore">0</span>`;
            log("Switched to 2-Player Local Mode.");
        });

        // Move Handle
        function handleCellClick(e) {
            const idx = parseInt(e.target.getAttribute('data-index'));
            if (gameState[idx] !== "" || !isGameActive) return;
            if (gameMode === "AI" && currentPlayer === "O") return; // Computer ki baari par user click block
            
            clickSound.currentTime = 0; clickSound.play();
            log(`Player ${currentPlayer} selected grid spot ${idx}`);
            makeMove(idx, currentPlayer);

            if (isGameActive) {
                if (gameMode === "AI") {
                    currentPlayer = "O";
                    statusText.innerText = "ð¤ AI thinking...";
                    setTimeout(computerTurn, 500);
                } else {
                    currentPlayer = currentPlayer === "X" ? "O" : "X";
                    statusText.innerText = `Player ${currentPlayer} ki baari`;
                }
            }
        }

        // Unbeatable Minimax AI Engine
        function computerTurn() {
            if (!isGameActive) return;
            let bestScore = -Infinity, bestMove;
            for (let i = 0; i < 9; i++) {
                if (gameState[i] === "") {
                    gameState[i] = "O";
                    let score = minimax(gameState, 0, false);
                    gameState[i] = "";
                    if (score > bestScore) { bestScore = score; bestMove = i; }
                }
            }
            clickSound.currentTime = 0; clickSound.play();
            log(`AI-Bot placed 'O' at spot ${bestMove}`);
            makeMove(bestMove, "O");
            if (isGameActive) { currentPlayer = "X"; statusText.innerText = "Aapki baari (X)"; }
        }

        function minimax(state, depth, isMax) {
            let res = checkWinnerMinimax();
            if (res !== null) return res === "O" ? 10 - depth : res === "X" ? depth - 10 : 0;
            
            if (isMax) {
                let bs = -Infinity;
                for(let i=0; i<9; i++) { if(state[i]==="") { state[i]="O"; bs = Math.max(minimax(state, depth+1, false), bs); state[i]=""; } }
                return bs;
            } else {
                let bs = Infinity;
                for(let i=0; i<9; i++) { if(state[i]==="") { state[i]="X"; bs = Math.min(minimax(state, depth+1, true), bs); state[i]=""; } }
                return bs;
            }
        }

        function checkWinnerMinimax() {
            let win = null;
            winLines.forEach(l => { if(gameState[l[0]]!=="" && gameState[l[0]]===gameState[l[1]] && gameState[l[1]]===gameState[l[2]]) win=gameState[l[0]]; });
            return win === null && !gameState.includes("") ? "tie" : win;
        }

        function makeMove(idx, p) {
            gameState[idx] = p;
            cells[idx].innerText = p;
            cells[idx].classList.add(p);
            checkResult();
        }

        function checkResult() {
            let won = winLines.some(l => gameState[l[0]] !== "" && gameState[l[0]] === gameState[l[1]] && gameState[l[1]] === gameState[l[2]]);
            if (won) {
                isGameActive = false;
                winSound.play();
                log(`Match Finished! Winner: Player ${currentPlayer}`);
                if (currentPlayer === "X") {
                    statusText.innerText = "ð Player 1 (X) Jeet Gaya! ð";
                    document.getElementById('uScore').innerText = ++scores.player1;
                } else {
                    statusText.innerText = gameMode === "AI" ? "ð¤ AI-Bot Jeet Gaya!" : "ð Player 2 (O) Jeet Gaya! ð";
                    document.getElementById('cScore').innerText = ++scores.player2;
                }
                return;
            }
            if (!gameState.includes("")) {
                statusText.innerText = "ð¤ Match Draw Hogaya!";
                document.getElementById('dScore').innerText = ++scores.draw;
                isGameActive = false;
                log("Match ended in a Draw.");
            }
        }

        function resetGame() {
            currentPlayer = "X"; gameState = ["", "", "", "", "", "", "", "", ""]; isGameActive = true;
            statusText.innerText = "Aapki baari (X)";
            cells.forEach(c => { c.innerText = ""; c.classList.remove('X', 'O'); });
            log("New Round Started.");
        }
        function resetScores() { scores = {player1:0, player2:0, draw:0}; document.getElementById('uScore').innerText=0; document.getElementById('cScore').innerText=0; document.getElementById('dScore').innerText=0; }

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        cells.forEach(c => c.addEventListener('click', handleCellClick));
    </script>
</body>
</html>
